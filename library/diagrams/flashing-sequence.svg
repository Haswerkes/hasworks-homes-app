<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t"><title id="t">Window flashing sequence</title><style>.bg{fill:#0b1220}.w{fill:#c8935a;stroke:#3b2612;stroke-width:1.5}.w2{fill:#e0b07a;stroke:#3b2612;stroke-width:1.5}.ln{stroke:#9fb3c8;stroke-width:1.5;fill:none}.dim{stroke:#38bdf8;stroke-width:1.5;fill:none}.ok{fill:#22c55e33;stroke:#22c55e;stroke-width:1.5}.no{fill:#ef444433;stroke:#ef4444;stroke-width:1.5}.hl{fill:#38bdf8;}.t{font:600 15px system-ui,sans-serif;fill:#e5edf5}.s{font:13px system-ui,sans-serif;fill:#9fb3c8}.c{font:700 14px system-ui,sans-serif;fill:#38bdf8}.m{fill:#64748b;stroke:#334155}.wrb{stroke:#a78bfa;stroke-width:3;fill:none}.fl{stroke:#f59e0b;stroke-width:3;fill:none}.mem{fill:#f59e0b55;stroke:#f59e0b;stroke-width:1.5}</style>
<rect class="bg" width="800" height="520"/>
<text class="t" x="20" y="30">Rainscreen window install - each layer laps over the one below it</text>
<rect class="w" x="200" y="80" width="400" height="340" style="fill:#1e293b"/>
<rect x="250" y="130" width="300" height="240" style="fill:#0b1220;stroke:#64748b"/>
<path class="mem" d="M235 370h330v24h-330z"/><path class="mem" d="M235 370v-24h15v24M565 370v-24h-15v24"/>
<path class="mem" d="M228 140h22v240h-22zM550 140h22v240h-22z" style="opacity:.8"/>
<rect x="258" y="138" width="284" height="226" style="fill:#38bdf822;stroke:#38bdf8;stroke-width:3"/>
<path class="fl" d="M240 122h320l12 10"/>
<path class="wrb" d="M200 112h400"/><path class="wrb" d="M200 80h400" style="stroke-dasharray:6 4"/>
<g class="c"><circle cx="190" cy="386" r="13" style="fill:#f59e0b"/><text x="190" y="391" text-anchor="middle" style="fill:#0b1220">1</text>
<circle cx="610" cy="260" r="13" style="fill:#f59e0b"/><text x="610" y="265" text-anchor="middle" style="fill:#0b1220">2</text>
<circle cx="400" cy="250" r="13" style="fill:#38bdf8"/><text x="400" y="255" text-anchor="middle" style="fill:#0b1220">3</text>
<circle cx="610" cy="125" r="13" style="fill:#f59e0b"/><text x="610" y="130" text-anchor="middle" style="fill:#0b1220">4</text>
<circle cx="610" cy="96" r="13" style="fill:#a78bfa"/><text x="610" y="101" text-anchor="middle" style="fill:#0b1220">5</text></g>
<g class="s"><text x="20" y="450">1 Sill membrane / pan, sloped out, with back dam and end dams turned up the jambs</text>
<text x="20" y="470">2 Jamb membranes lapped over the sill membrane  3 Window set on shims; seal jambs and head, leave the sill flange open to drain</text>
<text x="20" y="490">4 Head flashing over the head flange  5 WRB (or head membrane) lapped OVER the head flashing - never tucked under</text>
<text x="20" y="510">BCBC 9.7.6.2., 9.27.3.8.; interior air seal per 9.36.2.10.; follow the window maker's instructions</text></g>
</svg>
