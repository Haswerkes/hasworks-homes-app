<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="t"><title id="t">Stud layout on paired plates</title><style>.bg{fill:#0b1220}.w{fill:#c8935a;stroke:#3b2612;stroke-width:1.5}.w2{fill:#e0b07a;stroke:#3b2612;stroke-width:1.5}.ln{stroke:#9fb3c8;stroke-width:1.5;fill:none}.dim{stroke:#38bdf8;stroke-width:1.5;fill:none}.ok{fill:#22c55e33;stroke:#22c55e;stroke-width:1.5}.no{fill:#ef444433;stroke:#ef4444;stroke-width:1.5}.hl{fill:#38bdf8;}.t{font:600 15px system-ui,sans-serif;fill:#e5edf5}.s{font:13px system-ui,sans-serif;fill:#9fb3c8}.c{font:700 14px system-ui,sans-serif;fill:#38bdf8}.m{fill:#64748b;stroke:#334155}.wrb{stroke:#a78bfa;stroke-width:3;fill:none}.fl{stroke:#f59e0b;stroke-width:3;fill:none}.mem{fill:#f59e0b55;stroke:#f59e0b;stroke-width:1.5}</style>
<rect class="bg" width="800" height="360"/>
<text class="t" x="20" y="30">Top and bottom plate tacked together, marked at once (400 mm / 16 in o.c.)</text>
<rect class="w" x="20" y="70" width="760" height="40"/><rect class="w" x="20" y="110" width="760" height="40"/>
<g class="ln"><path d="M20 60v100M60 60v100"/></g><text class="c" x="40" y="180" text-anchor="middle">End</text>
<g class="ln">
<path d="M172 60v100M210 60v100"/><path d="M324 60v100M362 60v100"/><path d="M476 60v100M514 60v100"/><path d="M628 60v100M666 60v100"/></g>
<g class="c" text-anchor="middle"><text x="191" y="95">X</text><text x="343" y="95">K</text><text x="381" y="95" style="fill:#f59e0b">J</text><text x="457" y="95" style="fill:#f59e0b">J</text><text x="495" y="95">K</text><text x="647" y="95">X</text></g>
<path class="ln" d="M362 60v100M400 60v100M438 60v100"/><text class="c" x="419" y="95" style="fill:#a78bfa">C</text>
<g class="s" text-anchor="middle"><text x="191" y="180">400</text><text x="343" y="180">800</text><text x="419" y="200">Opening centre line</text><text x="647" y="180">1600</text></g>
<g class="s"><text x="20" y="250">X - common stud   K - king stud   J - jack stud   C - cripple on layout</text>
<text x="20" y="272">Pull every mark from the same end as the floor below, so studs stack over joists and sheathing joints land on studs.</text>
<text x="20" y="294">Intersections: mark ladder blocking or a backer stud for the partition and for drywall.</text>
<text x="20" y="316">BCBC 9.23.10.1. (stud size and spacing), 9.23.11. (plates)</text></g>
</svg>
